<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Преміальний Догляд Для Волосся | Фільтрація Алмазами</title>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- Автономные адаптивные стили (не требуют CDN и интернета для загрузки сетки) -->
    <style>
        :root {
            --brand-dark: #111111;
            --brand-gold: #c5a880;
            --brand-gray: #f9f9f9;
            --text-muted: #71717a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #ffffff; color: var(--brand-dark); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        
        /* Шапка сайта */
        .header { position: sticky; top: 0; z-index: 50; background: #ffffff; border-b: 1px solid #f4f4f5; height: 70px; display: flex; align-items: center; }
        .header-container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { text-transform: uppercase; font-weight: 700; tracking-key: 0.1em; font-size: 1.1rem; text-decoration: none; color: var(--brand-dark); }
        .logo span { display: block; font-size: 0.65rem; color: #a1a1aa; font-weight: 300; letter-spacing: 0; margin-top: -2px; }
        
        /* Навигация для десктопа */
        .nav-desktop { display: none; gap: 30px; }
        .nav-desktop a { font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.15em; text-decoration: none; color: var(--brand-dark); transition: color 0.3s; }
        .nav-desktop a:hover { color: var(--brand-gold); }
        
        /* Иконки и триггеры */
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .icon-btn { background: none; border: none; cursor: pointer; color: var(--brand-dark); position: relative; padding: 8px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { color: var(--brand-gold); }
        .cart-badge { position: absolute; top: 2px; right: 2px; background: var(--brand-gold); color: white; font-size: 0.65rem; font-weight: bold; width: 16px; height: 16px; rounded-circle: 50%; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        /* Бургер-кнопка */
        .burger-btn { display: flex; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 10px; min-width: 48px; min-height: 48px; justify-content: center; }
        .burger-line { width: 22px; height: 2px; background-color: var(--brand-dark); transition: 0.3s; }

        /* Мобильное меню (Выезжающее) */
        .mobile-menu { position: fixed; top: 0; left: -100%; width: 85%; max-width: 320px; height: 100vh; background: #ffffff; z-index: 100; box-shadow: 5px 0 15px rgba(0,0,0,0.1); transition: left 0.4s ease; padding: 40px 24px; display: flex; flex-direction: column; gap: 24px; }
        .mobile-menu.active { left: 0; }
        .mobile-menu a { font-size: 0.9rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; text-decoration: none; color: var(--brand-dark); padding: 8px 0; border-b: 1px solid #f4f4f5; }
        .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 90; display: none; }
        .menu-overlay.active { display: block; }
        .close-menu { align-self: flex-end; font-size: 1.5rem; background: none; border: none; cursor: pointer; margin-bottom: 20px; min-height: 48px; min-width: 48px; }

        /* Главный баннер (Hero) */
        .hero { relative: position; height: 65vh; min-height: 400px; background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)), url('image_miqH0z.png') center/cover no-repeat; display: flex; align-items: center; justify-content: center; text-align: center; color: #ffffff; padding: 20px; }
        .hero-content { max-width: 600px; }
        .hero-subtitle { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.25em; margin-bottom: 12px; font-weight: 300; }
        .hero-title { font-size: 1.85rem; font-weight: 300; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.3; margin-bottom: 24px; }
        .btn-primary { display: inline-block; background: #ffffff; color: var(--brand-dark); text-transform: uppercase; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.15em; padding: 14px 28px; text-decoration: none; transition: 0.3s; border: none; cursor: pointer; }
        .btn-primary:hover { background: var(--brand-gold); color: #ffffff; }

        /* Секция бестселлеров и сетка */
        .section-padding { padding: 60px 20px; max-width: 1280px; margin: 0 auto; }
        .section-title-block { text-align: center; margin-bottom: 40px; }
        .section-subtitle { font-size: 0.7rem; font-weight: 600; color: var(--brand-gold); text-transform: uppercase; letter-spacing: 0.15em; display: block; margin-bottom: 6px; }
        .section-title { font-size: 1.6rem; font-weight: 300; text-transform: uppercase; letter-spacing: 0.1em; }
        
        .products-grid { display: grid; grid-template-columns: 1fr; gap: 40px 20px; }
        
        /* Карточка товара */
        .product-card { display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .product-img-wrapper { width: 100%; aspect-ratio: 3/4; background: var(--brand-gray); overflow: hidden; position: relative; margin-bottom: 15px; }
        .product-img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .product-card:hover .product-img-wrapper img { transform: scale(1.03); }
        .product-badge { position: absolute; top: 12px; left: 12px; background: var(--brand-dark); color: white; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 8px; font-weight: 500; }
        
        .product-meta { font-size: 0.65rem; color: #a1a1aa; text-transform: uppercase; tracking: 0.05em; margin-bottom: 4px; }
        .product-name { font-size: 0.85rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--brand-dark); margin-bottom: 4px; min-height: 36px; }
        .product-desc { font-size: 0.75rem; color: var(--text-muted); font-style: italic; margin-bottom: 10px; }
        .product-price { font-size: 0.9rem; font-weight: 600; color: var(--brand-dark); }
        
        .btn-submit { width: 100%; background: var(--brand-dark); color: #ffffff; border: none; text-transform: uppercase; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.15em; padding: 14px; margin-top: 15px; cursor: pointer; transition: background 0.3s; min-height: 48px; }
        .btn-submit:hover { background: var(--brand-gold); }

        /* Боковая панель корзины (Drawer) */
        .cart-drawer { position: fixed; inset: 0; z-index: 110; display: none; }
        .cart-drawer.active { display: block; }
        .cart-blur { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
        .cart-content { position: absolute; top: 0; right: 0; width: 100%; max-width: 400px; height: 100%; background: #ffffff; box-shadow: -5px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; padding: 24px; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-b: 1px solid #e4e4e7; padding-bottom: 15px; }
        .cart-header h2 { font-size: 1.1rem; font-weight: 500; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px 0; }
        .cart-empty { text-align: center; color: #a1a1aa; font-size: 0.8rem; margin-top: 40px; line-height: 1.6; }
        .cart-footer { border-t: 1px solid #e4e4e7; pt: 15px; padding-top: 15px; background: var(--brand-gray); margin: 0 -24px -24px -24px; padding: 20px 24px; }
        .cart-total-row { display: flex; justify-content: space-between; font-weight: 500; font-size: 0.95rem; margin-bottom: 15px; }
        
        /* Медиа-запросы для планшетов и десктопов */
        @media (min-width: 640px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); }
            .hero { height: 75vh; }
            .hero-title { font-size: 2.5rem; }
        }
        @media (min-width: 1024px) {
            .nav-desktop { display: flex; }
            .burger-btn { display: none; }
            .products-grid { grid-template-columns: repeat(3, 1fr); }
            .hero-title { font-size: 3.2rem; }
            .section-padding { padding: 80px 40px; }
        }
    </style>
</head>
<body>

    <!-- НАВІГАЦІЙНА ПАНЕЛЬ -->
    <header class="header">
        <div class="header-container">
            <!-- Бургер-меню для мобільних (Покращено для тачу) -->
            <button class="burger-btn" onclick="toggleMobileMenu()" aria-label="Меню">
                <div class="burger-line"></div>
                <div class="burger-line" style="margin-top: 4px; margin-bottom: 4px;"></div>
                <div class="burger-line"></div>
            </button>

            <!-- Логотип бренду -->
            <a href="#" class="logo">
                SHAZAY <span>diamond filtered</span>
            </a>

            <!-- Десктопна навігація -->
            <nav class="nav-desktop">
                <a href="#products">Продукти</a>
                <a href="#philosophy">Філософія</a>
                <a href="#headspa">HeadSpa</a>
                <a href="#reviews">Відгуки</a>
            </nav>

            <!-- Іконка Кошика -->
            <div class="header-actions">
                <button onclick="toggleCart()" class="icon-btn" aria-label="Кошик">
