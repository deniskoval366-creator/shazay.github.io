<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAZAY — Diamond Filtered Haircare | Преміальний догляд</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Специфічний преміум-дизайн оригінального бренду SHAZAY */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0d0d0d; 
            color: #f5f5f4; 
            line-height: 1.6; 
            -webkit-font-smoothing: antialiased; 
        }
        
        a { text-decoration: none; color: inherit; transition: all 0.3s ease; }
        
        .container { max-w: 1200px; margin: 0 auto; padding: 0 24px; }
        
        /* Верхня плашка з акцією */
        .promo-bar { 
            background-color: #1a1a1a; 
            color: #d4af37; 
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-align: center; 
            padding: 10px 24px; 
            border-bottom: 1px solid #262626;
            font-weight: 500;
        }

        /* Навігація в стилі оригінального shazay.de */
        .header { 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            background-color: rgba(13, 13, 13, 0.9); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid #1a1a1a; 
        }
        .header-body { display: flex; align-items: center; justify-content: space-between; height: 90px; }
        
        .logo { 
            font-family: 'Cinzel', serif; 
            font-size: 26px; 
            font-weight: 400; 
            letter-spacing: 7px; 
            color: #ffffff; 
        }
        
        .nav { display: flex; gap: 40px; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; color: #a3a3a3; }
        .nav a:hover { color: #ffffff; letter-spacing: 2.5px; }
        
        .lang-badge { font-size: 11px; text-transform: uppercase; color: #737373; letter-spacing: 1px; border: 1px solid #262626; padding: 4px 10px; }

        /* Головний екран з великою знижкою */
        .hero { 
            position: relative; 
            min-height: 85vh; 
            display: flex; 
            align-items: center; 
            overflow: hidden; 
            border-bottom: 1px solid #1a1a1a;
        }
        .hero-bg { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: 0.45; 
            filter: grayscale(20%);
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, #0d0d0d 30%, rgba(13,13,13,0.7) 60%, transparent 100%);
            z-index: 1;
        }
        .hero-content { position: relative; z-index: 10; max-width: 600px; padding: 60px 0; }
        
        .sale-tag {
            display: inline-block;
            background-color: #d4af37;
            color: #0d0d0d;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 6px 14px;
            margin-bottom: 24px;
        }
        
        .hero h1 { 
            font-family: 'Cinzel', serif;
            font-size: 44px; 
            font-weight: 400; 
            color: #ffffff; 
            line-height: 1.2; 
            margin-bottom: 24px; 
            letter-spacing: 2px;
        }
        .hero h1 span { font-family: 'Inter', sans-serif; font-style: italic; font-weight: 200; color: #d4af37; }
        .hero p { font-size: 16px; color: #a3a3a3; margin-bottom: 32px; font-weight: 300; }
        
        .btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            background-color: #ffffff; 
            color: #0d0d0d; 
            font-size: 13px; 
            text-transform: uppercase;
            letter-spacing: 2px; 
            font-weight: 400; 
            padding: 16px 36px; 
            transition: all 0.3s; 
            border: none; 
            cursor: pointer; 
        }
        .btn:hover { background-color: #d4af37; color: #0d0d0d; transform: translateY(-2px); }

        /* Секції */
        .section { padding: 120px 0; border-bottom: 1px solid #1a1a1a; }
        .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: #737373; font-weight: 400; margin-bottom: 12px; display: block; }
        .section h2 { font-family: 'Cinzel', serif; font-size: 36px; font-weight: 400; color: #ffffff; margin-bottom: 64px; letter-spacing: 1px; }

        /* Сітка продуктів оригінального вигляду */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px; }
        .product-card { 
            display: flex; 
            flex-direction: column; 
            background-color: #121212; 
            border: 1px solid #1a1a1a; 
            padding: 32px; 
            transition: all 0.4s ease; 
        }
        .product-card:hover { border-color: #d4af37; transform: translateY(-4px); }
        
        .product-img-wrapper { 
            aspect-ratio: 1/1; 
            background-color: #0d0d0d; 
            margin-bottom: 32px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        .product-img { max-height: 90%; max-width: 90%; object-fit: contain; transition: transform 0.4s; }
        .product-card:hover .product-img { transform: scale(1.05); }
        
        .product-tag { font-size: 11px; color: #737373; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .product-title { font-family: 'Cinzel', serif; font-size: 16px; font-weight: 400; color: #ffffff; margin-bottom: 12px; letter-spacing: 1px; }
        .product-desc { font-size: 13px; color: #a3a3a3; margin-bottom: 32px; flex-grow: 1; font-weight: 300; }
        
        .product-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 20px; border-top: 1px solid #1a1a1a; }
        
        /* Ціни зі знижкою */
        .price-box { display: flex; flex-direction: column; }
        .old-price { font-size: 13px; color: #525252; text-decoration: line-through; font-weight: 300; }
        .product-price { font-size: 18px; font-weight: 400; color: #d4af37; }
        
        .btn-sm { font-size: 11px; padding: 10px 20px; background-color: #1a1a1a; color: #ffffff; border: 1px solid #262626; }
        .btn-sm:hover { background-color: #ffffff; color: #0d0d0d; border-color: #ffffff; }

        /* Технологічний блок (Чорна розкіш) */
        .tech-layout { display: grid; grid-template-columns: 1fr; gap: 80px; align-items: center; }
        @media (min-width: 1024px) { .tech-layout { grid-template-columns: 1fr 1fr; } }
        .tech-text p { color: #a3a3a3; margin-bottom: 24px; font-size: 15px; font-weight: 300; }
        
        .tech-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 48px; padding-top: 40px; border-top: 1px solid #1a1a1a; }
        .stat-val { font-family: 'Cinzel', serif; font-size: 36px; color: #d4af37; }
        .stat-lbl { font-size: 11px; text-transform: uppercase; color: #737373; letter-spacing: 2px; margin-top: 6px; }
        
        .tech-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .tech-img-box { aspect-ratio: 4/5; background-color: #121212; overflow: hidden; position: relative; border: 1px solid #1a1a1a; }
        .tech-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .tech-img-lbl { position: absolute; bottom: 20px; left: 20px; font-size: 11px; text-transform: uppercase; color: #ffffff; background-color: rgba(13, 13, 13, 0.8); padding: 6px 12px; letter-spacing: 1px; border: 1px solid #262626; }

        /* Про бренд */
        .about-layout { display: grid; grid-template-columns: 1fr; gap: 64px; align-items: center; }
        @media (min-width: 1024px) { .about-layout { grid-template-columns: 5fr 7fr; } }
        .about-img-box { aspect-ratio: 3/4; background-color: #121212; overflow: hidden; border: 1px solid #1a1a1a; }
        .about-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .about-content { padding-left: 0; }
        @media (min-width: 1024px) { .about-content { padding-left: 48px; } }
        .quote { font-family: 'Cinzel', serif; font-size: 22px; font-style: italic; color: #ffffff; border-left: 2px solid #d4af37; padding-left: 32px; margin-bottom: 32px; font-weight: 400; line-height: 1.4; }
        .about-desc { color: #a3a3a3; margin-bottom: 40px; font-weight: 300; }

        /* Футер */
        .footer { background-color: #080808; color: #737373; padding: 64px 0; font-size: 13px; border-top: 1px solid #1a1a1a; }
        .footer-body { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 32px; }
        @media (min-width: 640px) { .footer-body { flex-direction: row; } }
        .footer-links { display: flex; gap: 32px; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
        .footer-links a:hover { color: #ffffff; }
        .copy { font-size: 11px; color: #404040; letter-spacing: 1px; }
        
        @media (max-width: 768px) { .header .nav { display: none; } }
    </style>
</head>
<body>

    <!-- Верхня плашка з акцією -->
    <div class="promo-bar">
